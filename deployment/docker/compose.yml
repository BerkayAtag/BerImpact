name: berimpact
services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_DB: berimpact
      POSTGRES_USER: berimpact_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password, db_runtime_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U berimpact_owner -d berimpact"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  migrate:
    image: berimpact-api:0.1.1
    build: { context: ../.., dockerfile: deployment/docker/Dockerfile, target: api }
    command: ["--migrate", "true"]
    environment:
      ConnectionStrings__Database: Host=postgres;Database=berimpact;Username=berimpact_owner
      DatabasePasswordFile: /run/secrets/db_owner_password
      Logging__LogLevel__Default: Warning
    secrets: [db_owner_password]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [backend]
  api:
    image: berimpact-api:0.1.1
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Database=berimpact;Username=berimpact_runtime
      DatabasePasswordFile: /run/secrets/db_runtime_password
      DataProtectionPath: /keys
      DataProtectionCertificate: /run/secrets/key_certificate
      DataProtectionCertificatePasswordFile: /run/secrets/key_certificate_password
      TrustedProxy: ${BERIMPACT_PROXY_IP:-172.29.197.254}
      Logging__LogLevel__Default: Warning
    secrets: [db_runtime_password, key_certificate, key_certificate_password]
    volumes: ["${BERIMPACT_KEYS_DIR:?Set BERIMPACT_KEYS_DIR}:/keys"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [backend, web]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  worker:
    image: berimpact-worker:0.1.1
    build: { context: ../.., dockerfile: deployment/docker/Dockerfile, target: worker }
    restart: unless-stopped
    environment:
      ConnectionStrings__Database: Host=postgres;Database=berimpact;Username=berimpact_runtime
      DatabasePasswordFile: /run/secrets/db_runtime_password
      Logging__LogLevel__Default: Warning
    secrets: [db_runtime_password]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["${BERIMPACT_BIND_ADDRESS:-127.0.0.1}:${BERIMPACT_HTTPS_PORT:-8443}:443"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    secrets: [tls_certificate, tls_key]
    depends_on: [api]
    networks:
      web:
        ipv4_address: ${BERIMPACT_PROXY_IP:-172.29.197.254}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://api:8080/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
secrets:
  db_owner_password: { file: "${BERIMPACT_SECRETS_DIR:?Set BERIMPACT_SECRETS_DIR}/db-owner-password" }
  db_runtime_password: { file: "${BERIMPACT_SECRETS_DIR}/db-runtime-password" }
  key_certificate: { file: "${BERIMPACT_SECRETS_DIR}/key-protection.pfx" }
  key_certificate_password: { file: "${BERIMPACT_SECRETS_DIR}/key-protection-password" }
  tls_certificate: { file: "${BERIMPACT_SECRETS_DIR}/tls.crt" }
  tls_key: { file: "${BERIMPACT_SECRETS_DIR}/tls.key" }
volumes:
  postgres_data:
networks:
  backend: { internal: true }
  web:
    ipam:
      config:
        - subnet: ${BERIMPACT_WEB_SUBNET:-172.29.197.0/24}
          ip_range: ${BERIMPACT_WEB_DYNAMIC_RANGE:-172.29.197.0/25}
